podAnnotations:
  vault.security.banzaicloud.io/vault-role: "false"
  vault.security.banzaicloud.io/vault-path: "false"
  vault.security.banzaicloud.io/vault-addr: "false"
  vault.security.banzaicloud.io/vault-skip-verify: "false"
  vault.security.banzaicloud.io/vault-agent: "false"
  prometheus.io/path: "false"
  prometheus.io/scheme: "false"
  prometheus.io/scrape: "false"
  prometheus.io/port: "false"

ingress:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/server-snippet: |
      if ($host = "tr.vimpelcom.ru") {
        rewrite / https://beeatlas.vimpelcom.ru/models/tech-radar permanent;
      }
      if ($host = "techradar.vimpelcom.ru") {
        rewrite / https://beeatlas.vimpelcom.ru/models/tech-radar permanent;
      }
  hosts:
    - host: "changehost"
      paths:
        - path: /
          pathType: ImplementationSpecific
    - host: "beeatlas.vimpelcom.ru"
      paths:
      - path: /
        pathType: ImplementationSpecific
    - host: "techradar.vimpelcom.ru"
      paths:
      - path: /
        pathType: ImplementationSpecific
    - host: "tr.vimpelcom.ru"
      paths:
      - path: /
        pathType: ImplementationSpecific
    - host: "eafdmmart-prod.apps.yd-m3-k21.vimpelcom.ru"
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - hosts:
        - frontend-arhitect-area-prod-eafdmmart.apps.yd-m3-k21.vimpelcom.ru
      secretName: fdm-tls
    - hosts:
        - beeatlas.vimpelcom.ru
        - tr.vimpelcom.ru
        - techradar.vimpelcom.ru
      secretName: fdm-tls

env:
  NGINX_LOCATION_API_GATEWAY: http://fdm-gateway-prod-service:8080/api-gateway
  NGINX_LOCATION_API_GATEWAY_ADDITIONAL_PARAMS: 'proxy_set_header Host fdm-gateway-prod-service;'
  NGINX_LOCATION_API: http://eafdmmart-backend-prod-service:8080/api
  NGINX_LOCATION_API_ADDITIONAL_PARAMS: 'proxy_set_header Host eafdmmart-backend-prod-service;'

replicaCount: 1
